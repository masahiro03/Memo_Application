<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Object Detection</title>
    <script src="js/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/sample.css">
</head>

<body>

    <header>
        
    <header class="site-header">
        <h1 class="site-logo">Object Detection</h1>
            <nav class="site-nav" aria-label="メインナビゲーション">
                <ul>
                    <li><a href="#about">Register</a></li>
                    <li><a href="#service">List</a></li>
                </ul>
            </nav>
    </header>

    <main style="display:none;">

        <div class="register">
                <h2>Register</h2>
        </div>

        <div class="contact-form">
          <form action="submit_form.php" method="post">
            <div class="form-row">
              <label for="name">物件名</label>
              <input type="text" id="name" name="name" required>
            </div>

            <div class="form-row">
              <label for="room_number">部屋数</label>
              <input type="text" id="room_number" name="room_number" required>
            </div>

            <div class="photo-field">
              <label for="photo">写真</label>
              <div class="photo-controls">
                <input type="file" id="photo" name="photo" accept="image/*">
                <p id="photo-error" class="photo-error" role="alert" hidden></p>
                <img id="photo-preview" class="photo-preview" alt="選択した写真のプレビュー" hidden>
              </div>
            </div>

            <div class="text_area">
              <label for="message">詳細</label>
              <textarea id="text_area" name="text_area" required></textarea>
            </div>

          </form>


        <ul class="save-clear">
            <li id="save">Save</li>
            <li id="clear">Clear</li>
        </ul>

    </main>

   
    <script>
        $("main").fadeIn(1000);

        const photoInput = document.querySelector("#photo");
        const photoPreview = document.querySelector("#photo-preview");
        const photoError = document.querySelector("#photo-error");
        const maxPhotoSize = 2 * 1024 * 1024;
        let photoPreviewUrl = "";
        let savedPhotoData = "";

        photoInput.addEventListener("change", function () {
            const file = photoInput.files[0];
            savedPhotoData = "";
            photoError.textContent = "";
            photoError.hidden = true;
            photoPreview.hidden = true;
            photoPreview.removeAttribute("src");

            if (photoPreviewUrl) {
                URL.revokeObjectURL(photoPreviewUrl);
                photoPreviewUrl = "";
            }

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                photoError.textContent = "画像ファイルを選択してください。";
            } else if (file.size > maxPhotoSize) {
                photoError.textContent = "画像は2MB以下のファイルを選択してください。";
            }

            if (photoError.textContent) {
                photoError.hidden = false;
                photoInput.value = "";
                return;
            }

            photoPreviewUrl = URL.createObjectURL(file);
            photoPreview.src = photoPreviewUrl;
            photoPreview.hidden = false;
        });

        function saveMemo(photoData) {
            const memo = {
                name: $("#name").val(),
                roomNumber: $("#room_number").val(),
                detail: $("#text_area").val(),
                photo: photoData
            };

            try {
                localStorage.setItem("memo", JSON.stringify(memo));
                savedPhotoData = photoData;
                alert("saveしました");
            } catch (error) {
                alert("保存できませんでした。画像サイズを小さくしてください。");
            }
        }

        // 1. Save クリックイベント
        $("#save").on("click", function () {
            const file = photoInput.files[0];

            if (!file) {
                saveMemo(savedPhotoData);
                return;
            }

            const reader = new FileReader();
            reader.onload = function () {
                saveMemo(reader.result);
            };
            reader.onerror = function () {
                alert("画像を読み込めませんでした。");
            };
            reader.readAsDataURL(file);
        });

        // 2. Clear クリックイベント
        $("#clear").on("click", function () {
            localStorage.removeItem("memo");
            alert("clearしました");
            $("#name").val("");
            $("#room_number").val("");
            $("#text_area").val("");
            photoInput.value = "";
            savedPhotoData = "";
            photoPreview.hidden = true;
            photoPreview.removeAttribute("src");
            photoError.textContent = "";
            photoError.hidden = true;

            if (photoPreviewUrl) {
                URL.revokeObjectURL(photoPreviewUrl);
                photoPreviewUrl = "";
            }
        });

        // 3. ページ読み込み時に保存データを取得して表示
        const storedMemo = localStorage.getItem("memo");
        if (storedMemo) {
            let memo;
            try {
                memo = JSON.parse(storedMemo);
            } catch (error) {
                memo = { detail: storedMemo };
            }

            if (typeof memo === "string") {
                memo = { detail: memo };
            }

            if (memo && typeof memo === "object") {
                $("#name").val(memo.name || "");
                $("#room_number").val(memo.roomNumber || "");
                $("#text_area").val(memo.detail || "");

                if (typeof memo.photo === "string" && memo.photo.startsWith("data:image/")) {
                    savedPhotoData = memo.photo;
                    photoPreview.src = savedPhotoData;
                    photoPreview.hidden = false;
                }
            }
        }
    </script>


     <footer><small>Keybridge Digital Ltd. All rights reserved.</small></footer>


</body>

</html>
